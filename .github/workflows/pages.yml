name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build WebGL site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify assignment source and rubric invariants
        run: |
          python Assignment-2-3DFan/scripts/verify_submission.py
          python android-programming-quiz3/scripts/verify_submission.py

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      - name: Prepare site root
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll

      - name: Build Chapter 2 primitives
        working-directory: Chapter2/2-OpenGLES3_Primitives-Modern
        run: |
          bash build_web.sh
          mkdir -p ../../site/Chapter2/2-OpenGLES3_Primitives-Modern
          cp -r web/. ../../site/Chapter2/2-OpenGLES3_Primitives-Modern/

      - name: Build Assignment 1
        working-directory: AndroidProgrammingQuiz-CrossPlatformCI/AndroidProgrammingQuiz-CrossPlatformCI
        run: |
          bash build_web.sh
          mkdir -p ../../site/AndroidProgrammingQuiz-CrossPlatformCI
          cp -r web/. ../../site/AndroidProgrammingQuiz-CrossPlatformCI/

      - name: Build Assignment 2 - 3D Fan
        working-directory: Assignment-2-3DFan
        run: |
          bash build_web.sh
          mkdir -p ../site/Assignment-2-3DFan
          cp -r web/. ../site/Assignment-2-3DFan/

      - name: Build Programming Quiz 3
        working-directory: android-programming-quiz3
        run: |
          bash build_web.sh
          mkdir -p ../site/android-programming-quiz3
          cp -r web/. ../site/android-programming-quiz3/

      - name: Verify deployable site
        run: |
          test -s site/index.html
          test -s site/Assignment-2-3DFan/index.html
          test -s site/Assignment-2-3DFan/index.js
          test -s site/Assignment-2-3DFan/index.wasm
          test -s site/Assignment-2-3DFan/index.data
          test -s site/android-programming-quiz3/index.html
          test -s site/android-programming-quiz3/index.js
          test -s site/android-programming-quiz3/index.wasm
          test -s site/android-programming-quiz3/index.data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Deploy GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
