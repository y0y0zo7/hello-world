name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Desktop • ${{ matrix.name }} • ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Chapter2/2-OpenGLES3_Primitives-Modern
            name: 2-OpenGLES3-Primitives
            os: ubuntu-latest
            run_tests: false
          - project: Chapter2/2-OpenGLES3_Primitives-Modern
            name: 2-OpenGLES3-Primitives
            os: windows-latest
            run_tests: false
          - project: AndroidProgrammingQuiz-CrossPlatformCI/AndroidProgrammingQuiz-CrossPlatformCI
            name: Assignment-1
            os: ubuntu-latest
            run_tests: false
          - project: AndroidProgrammingQuiz-CrossPlatformCI/AndroidProgrammingQuiz-CrossPlatformCI
            name: Assignment-1
            os: windows-latest
            run_tests: false
          - project: android-programming-2
            name: Assignment-2-3D-Fan
            os: ubuntu-latest
            run_tests: true
          - project: android-programming-2
            name: Assignment-2-3D-Fan
            os: windows-latest
            run_tests: true

    steps:
      - uses: actions/checkout@v6

      - name: Verify Assignment 2 source and rubric invariants
        if: matrix.name == 'Assignment-2-3D-Fan' && runner.os == 'Linux'
        run: python android-programming-2/scripts/verify_submission.py

      - name: Install OpenGL and window-system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Cache pinned CMake dependencies
        uses: actions/cache@v5
        with:
          path: ${{ matrix.project }}/build_ci/_deps
          key: cmake-deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/cmake/ImportDependencies.cmake', matrix.project)) }}
          restore-keys: cmake-deps-${{ runner.os }}-${{ matrix.name }}-

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure with CMake (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.project }}
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release

      - name: Configure with CMake and Ninja (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.project }}
        run: cmake -S . -B build_ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ${{ matrix.project }}
        run: cmake --build build_ci --config Release --parallel

      - name: Run Assignment 2 interaction tests
        if: matrix.run_tests
        working-directory: ${{ matrix.project }}
        run: ctest --test-dir build_ci -C Release --output-on-failure
