name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build WebGL site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify source and rubric invariants
        run: python scripts/verify_submission.py

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      - name: Build WebGL application
        run: bash build_web.sh

      - name: Verify deployable site
        run: |
          test -s web/index.html
          test -s web/index.js
          test -s web/index.wasm
          test -s web/index.data
          touch web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    name: Deploy GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
