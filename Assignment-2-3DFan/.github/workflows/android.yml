name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify source and rubric invariants
        run: python scripts/verify_submission.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK and CMake
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail

          install_sdk_package() {
            local package="$1"
            local destination="$2"

            for attempt in 1 2 3; do
              echo "Installing ${package} (attempt ${attempt}/3)"
              if sdkmanager --sdk_root="${ANDROID_HOME}" "${package}" \
                  && test -f "${destination}/source.properties"; then
                echo "Installed and verified ${package}"
                return 0
              fi

              echo "::warning::${package} download was incomplete; clearing temporary files before retry"
              rm -rf "${ANDROID_HOME}/.temp" "${destination}"
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done

            echo "::error::Unable to install ${package} after three verified attempts"
            return 1
          }

          install_sdk_package "cmake;3.22.1" "${ANDROID_HOME}/cmake/3.22.1"
          install_sdk_package "ndk;27.0.12077973" "${ANDROID_HOME}/ndk/27.0.12077973"

      - name: Read pinned Gradle version
        id: gradle-version
        working-directory: android
        shell: bash
        run: |
          version=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
            | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Write local Android SDK path
        working-directory: android
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build and lint
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Assignment-2-3DFan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
