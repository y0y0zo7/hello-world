plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.fan3d'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.example.fan3d'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    lint {
        warningsAsErrors true
        // AGP 8.12 supports API 36 at most. GitHub runners may also contain
        // the API 37 preview, which makes OldTargetApi fail based on runner
        // contents even though this project uses AGP's highest supported API.
        disable 'AndroidGradlePluginVersion', 'OldTargetApi'
    }
}
