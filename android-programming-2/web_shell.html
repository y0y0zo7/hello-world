<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment 2 - 3D Fan</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07101f; color: #e5edf9; }
    main { width: min(94vw, 860px); padding: 1.5rem 0 2rem; text-align: center; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.5rem, 4vw, 2.4rem); }
    p { color: #aebed4; margin: .35rem 0 1rem; }
    .stage { overflow: hidden; border: 1px solid #263a58; border-radius: 18px; background: #06101d; box-shadow: 0 24px 80px #0009; }
    canvas { width: 100%; height: auto; aspect-ratio: 8 / 7; display: block; background: #06101d; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .bar { display: flex; gap: .75rem; align-items: center; justify-content: space-between; padding: .75rem 1rem; background: #0c192b; }
    #status { margin: 0; font-size: .9rem; text-align: left; }
    button { border: 1px solid #42658f; border-radius: 999px; padding: .55rem .9rem; color: #f5f8ff; background: #183251; cursor: pointer; }
    button:hover { background: #22456e; }
  </style>
</head>
<body>
  <main>
    <h1>3D Fan</h1>
    <p>Click to toggle the fan. Hold and drag faster to increase blade speed.</p>
    <section class="stage" aria-label="Interactive WebGL fan">
      <canvas id="canvas" width="800" height="700" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      <div class="bar">
        <p id="status">Loading WebGL...</p>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
    </section>
  </main>
  <script>
    const statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus(message) { statusElement.textContent = message || 'Ready - click or drag the fan'; },
      monitorRunDependencies(left) { this.setStatus(left ? `Loading (${left})...` : 'Starting...'); },
      printErr(text) { console.error(text); }
    };
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (Module.requestFullscreen) Module.requestFullscreen(false, true);
      else Module.canvas.requestFullscreen?.();
    });
    window.addEventListener('error', event => Module.setStatus(`Error: ${event.message}`));
  </script>
  {{{ SCRIPT }}}
</body>
</html>
